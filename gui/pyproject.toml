[project]
name = "lugalgui"
version = "0.1.0"
description = "LugalChess PySide6 Cross-Platform GUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.2",
    "pyrefly>=1.1.1",
    "pyserial>=3.5",
    "pyside6>=6.11.1",
    "python-chess>=1.999",
    "qasync>=0.28.0",
]

[project.scripts]
lugalgui = "lugalgui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
